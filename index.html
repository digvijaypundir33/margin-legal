<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Margin — Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FAF7F2;
      color: #1A1510;
      min-height: 100vh;
    }
    header {
      background: #12100E;
      padding: 64px 24px 52px;
      text-align: center;
    }
    header .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #C8960C;
      margin-bottom: 14px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: #F5EFE0;
      line-height: 1.2;
    }
    header p.sub {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 300;
      color: #F5EFE0;
      opacity: 0.4;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h2 {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #C8960C;
      margin-bottom: 16px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 40px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05);
    }
    .card a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      text-decoration: none;
      color: #1A1510;
      transition: background 0.15s;
    }
    .card a:hover { background: #F5EFE0; }
    .card a + a { border-top: 1px solid rgba(0,0,0,0.06); }
    .card a .title {
      font-size: 16px;
      font-weight: 400;
    }
    .card a .arrow {
      font-size: 18px;
      color: #C8960C;
      opacity: 0.6;
    }
    .support {
      text-align: center;
      font-size: 13px;
      color: rgba(26,21,16,0.4);
    }
    .support a { color: #C8960C; text-decoration: none; }
    .support a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Margin App</p>
    <h1>Legal</h1>
    <p class="sub">Policies & Terms</p>
  </header>
  <main>
    <h2>Documents</h2>
    <div class="card">
      <a href="/margin-legal/privacy/">
        <span class="title">Privacy Policy</span>
        <span class="arrow">›</span>
      </a>
      <a href="/margin-legal/terms/">
        <span class="title">Terms of Use</span>
        <span class="arrow">›</span>
      </a>
    </div>
    <p class="support">
      For support, contact <a href="mailto:digvijay.pundir33@gmail.com">digvijay.pundir33@gmail.com</a>
    </p>
  </main>
</body>
</html>
